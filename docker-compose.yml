# Local/staging stack. For production use managed Postgres/Redis, real secrets and HTTPS at the proxy.
x-backend: &backend
  build: ./backend
  env_file: ./backend/.env
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }

services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: talent, POSTGRES_PASSWORD: talent, POSTGRES_DB: talentgauge }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U talent"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
  backend:
    <<: *backend
    entrypoint: ["./entrypoint.sh"]
    command: ["gunicorn", "config.wsgi:application", "-b", "0.0.0.0:8000", "-w", "4", "--timeout", "30"]
    ports: ["8000:8000"]
  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-Q", "celery,notifications,reports,scheduled", "-l", "info"]
  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "-l", "info"]
  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1" }
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
